<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d1117"><title>Pete Sudoku</title><style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b2430;--panel3:#212c39;--text:#f5f7fb;--muted:#93a0b2;--accent:#7aa2ff;--accentStrong:#5f8df4;--accentText:#081120;--line:#506075;--wrong:#ff6978;--selected:#294778;--peer:#1c2a3a;--same:#263b5c;--given:#fff;--shadow:0 14px 38px #0006}:root[data-theme="light"]{--bg:#f2f5f9;--panel:#fff;--panel2:#f7f9fc;--panel3:#edf2f8;--text:#17202d;--muted:#657286;--accent:#3f70dc;--accentStrong:#3261c5;--accentText:#fff;--line:#76869b;--wrong:#d8374d;--selected:#cfe0ff;--peer:#eaf1fb;--same:#dce8fb;--given:#101722;--shadow:0 12px 30px #24354b21}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px);display:flex;justify-content:center}button{font:inherit}.app{width:min(100%,570px)}.header{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:var(--shadow)}.title{font-size:27px;font-weight:850;line-height:1}.subtitle{color:var(--muted);font-size:12px;margin-top:4px}.header-actions{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font-size:19px}.icon-btn:active{transform:scale(.95)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.metric{background:var(--panel);border-radius:12px;padding:8px 10px;text-align:center}.metric .v{font-weight:820;font-size:16px;font-variant-numeric:tabular-nums}.metric .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}.board-wrap{background:var(--panel);padding:7px;border-radius:18px;box-shadow:var(--shadow)}#board{aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,1fr);background:var(--line);gap:1px;border:2px solid var(--line);border-radius:11px;overflow:hidden;touch-action:manipulation}.cell{position:relative;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:clamp(20px,6.9vw,34px);font-weight:650;cursor:pointer;user-select:none}.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--line)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line)}.cell.given{color:var(--given);font-weight:850}.cell.user{color:var(--accent)}.cell.peer{background:var(--peer)}.cell.same{background:var(--same)}.cell.selected{background:var(--selected);outline:2px solid var(--accent);outline-offset:-2px}.cell.conflict,.cell.wrong{color:var(--wrong)}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,2.2vw,11px);font-weight:700;color:var(--muted)}.note{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:13px 0 9px}.num{position:relative;height:52px;border:0;border-radius:11px;background:var(--panel);color:var(--accent);font-size:22px;font-weight:850}.num:active{transform:scale(.96);background:var(--panel3)}.num.done{opacity:.35}.remain{position:absolute;right:5px;top:3px;color:var(--muted);font-size:8px}.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.tool{min-height:56px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font-size:10px;font-weight:780;padding:6px 2px}.tool .ico{display:block;font-size:19px;line-height:22px;margin-bottom:2px}.tool.active{background:var(--accentStrong);color:#fff}.tool:active{transform:scale(.97)}.new{width:100%;margin-top:9px;height:50px;border:0;border-radius:13px;background:var(--accent);color:var(--accentText);font-size:16px;font-weight:880}.message{height:24px;text-align:center;color:var(--muted);font-size:13px;padding-top:6px}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:22px;z-index:20;backdrop-filter:blur(4px)}.overlay.show{display:flex}.card{width:min(100%,430px);background:var(--panel);color:var(--text);border-radius:20px;padding:21px;box-shadow:0 20px 60px #0007}.card h2{margin:0 0 6px;font-size:24px}.card p{color:var(--muted);margin:0 0 16px;line-height:1.45}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:0;background:var(--panel3);color:var(--text);padding:14px 9px;border-radius:13px;font-weight:820;font-size:15px}.choice small{display:block;color:var(--muted);font-weight:600;margin-top:4px}.cancel{width:100%;margin-top:10px;border:0;background:transparent;color:var(--muted);padding:10px;font-weight:750}.pause-card{text-align:center}.pause-icon{font-size:45px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}.stat{background:var(--panel3);border-radius:12px;padding:11px 6px;text-align:center}.stat strong{font-size:19px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-top:2px}.best-list{display:grid;gap:7px}.best-row{display:flex;justify-content:space-between;background:var(--panel3);border-radius:10px;padding:9px 11px;font-size:13px}.best-row span:last-child{font-weight:800;color:var(--accent)}@media(max-width:380px){body{padding-left:7px;padding-right:7px}.board-wrap{padding:5px}.pad{gap:3px}.num{height:46px}.tools{gap:4px}.tool{font-size:9px;min-height:52px}}
</style></head><body><div class="app"><div class="header"><div class="brand"><div class="logo">9×9</div><div><div class="title">Sudoku</div><div class="subtitle" id="progress">Offline puzzle</div></div></div><div class="header-actions"><button class="icon-btn" id="statsBtn">▥</button><button class="icon-btn" id="themeBtn">☾</button></div></div><div class="metrics"><div class="metric"><div class="v" id="difficulty">Easy</div><div class="k">Difficulty</div></div><div class="metric"><div class="v" id="timer">00:00</div><div class="k">Time</div></div><div class="metric"><div class="v" id="mistakes">0</div><div class="k">Mistakes</div></div></div><div class="board-wrap"><div id="board"></div></div><div class="pad" id="pad"></div><div class="tools"><button class="tool" id="pencil"><span class="ico">✎</span>Notes</button><button class="tool" id="erase"><span class="ico">⌫</span>Erase</button><button class="tool" id="undo"><span class="ico">↶</span>Undo</button><button class="tool" id="hint"><span class="ico">💡</span>Hint</button><button class="tool" id="check"><span class="ico">✓</span>Check</button><button class="tool" id="pause"><span class="ico">Ⅱ</span>Pause</button></div><button class="new" id="newGame">New game</button><div class="message" id="message"></div></div>
<div class="overlay" id="difficultyModal"><div class="card"><h2>New game</h2><p>Choose a difficulty. Puzzles are generated on your phone and work fully offline.</p><div class="choices"><button class="choice" data-diff="easy">Easy<small>Relaxed</small></button><button class="choice" data-diff="medium">Medium<small>Balanced</small></button><button class="choice" data-diff="hard">Hard<small>Challenging</small></button><button class="choice" data-diff="expert">Expert<small>Very few clues</small></button></div><button class="cancel" id="cancelModal">Cancel</button></div></div><div class="overlay" id="winModal"><div class="card"><h2>🎉 Puzzle solved</h2><p id="winText"></p><div class="stat-grid"><div class="stat"><strong id="winTime">00:00</strong><span>Time</span></div><div class="stat"><strong id="winMistakes">0</strong><span>Mistakes</span></div><div class="stat"><strong id="winBest">—</strong><span>Best</span></div></div><button class="new" id="playAgain">Play another</button><button class="cancel" id="closeWin">Close</button></div></div><div class="overlay" id="pauseModal"><div class="card pause-card"><div class="pause-icon">Ⅱ</div><h2>Game paused</h2><p>The timer is stopped.</p><button class="new" id="resumeBtn">Resume</button></div></div><div class="overlay" id="statsModal"><div class="card"><h2>Statistics</h2><div class="stat-grid"><div class="stat"><strong id="playedStat">0</strong><span>Played</span></div><div class="stat"><strong id="winsStat">0</strong><span>Solved</span></div><div class="stat"><strong id="rateStat">0%</strong><span>Win rate</span></div></div><div class="best-list" id="bestList"></div><button class="cancel" id="closeStats">Close</button></div></div>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),boardEl=$('board'),padEl=$('pad'),timerEl=$('timer'),diffEl=$('difficulty'),progressEl=$('progress'),messageEl=$('message'),mistakesEl=$('mistakes'),difficultyModal=$('difficultyModal'),winModal=$('winModal'),pauseModal=$('pauseModal'),statsModal=$('statsModal'),targets={easy:36,medium:45,hard:51,expert:56};let puzzle=[],solution=[],current=[],notes=[],selected=-1,pencil=false,seconds=0,timerHandle=null,history=[],difficulty='easy',wrong=new Set(),solved=false,mistakes=0,paused=false,stats=loadStats();function haptic(){try{if(window.Android&&Android.haptic)Android.haptic()}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pattern(r,c){return(r*3+Math.floor(r/3)+c)%9}function makeSolution(){const b=[0,1,2],rows=shuffle(b.slice()).flatMap(g=>shuffle(b.slice()).map(r=>g*3+r)),cols=shuffle(b.slice()).flatMap(g=>shuffle(b.slice()).map(c=>g*3+c)),nums=shuffle([1,2,3,4,5,6,7,8,9]);return rows.flatMap(r=>cols.map(c=>nums[pattern(r,c)]))}function candidates(b,i){if(b[i])return[];const r=Math.floor(i/9),c=i%9,u=new Set;for(let x=0;x<9;x++){u.add(b[r*9+x]);u.add(b[x*9+c])}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)u.add(b[rr*9+cc]);return[1,2,3,4,5,6,7,8,9].filter(n=>!u.has(n))}function countSolutions(b,l=2){let best=-1,bc=null;for(let i=0;i<81;i++)if(!b[i]){const c=candidates(b,i);if(!c.length)return 0;if(best<0||c.length<bc.length){best=i;bc=c;if(c.length===1)break}}if(best<0)return 1;let count=0;for(const n of bc){b[best]=n;count+=countSolutions(b,l-count);b[best]=0;if(count>=l)return count}return count}function makePuzzle(d){const sol=makeSolution(),p=sol.slice(),order=shuffle([...Array(81).keys()]),t=targets[d];let rem=0;for(const i of order){if(rem>=t)break;const old=p[i];p[i]=0;if(countSolutions(p.slice(),2)===1)rem++;else p[i]=old}return{p,sol}}function blankNotes(){return Array.from({length:81},()=>new Set)}function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(){clearInterval(timerHandle);if(solved||paused)return;timerHandle=setInterval(()=>{seconds++;timerEl.textContent=formatTime(seconds);if(seconds%5===0)save()},1000)}function stopTimer(){clearInterval(timerHandle)}function pushHistory(){history.push({current:current.slice(),notes:notes.map(s=>[...s]),wrong:[...wrong],mistakes});if(history.length>100)history.shift()}function peer(a,b){const ar=Math.floor(a/9),ac=a%9,br=Math.floor(b/9),bc=b%9;return ar===br||ac===bc||(Math.floor(ar/3)===Math.floor(br/3)&&Math.floor(ac/3)===Math.floor(bc/3))}function hasConflict(i){const v=current[i];if(!v)return false;for(let x=0;x<81;x++)if(x!==i&&current[x]===v&&peer(x,i))return true;return false}function clearPeerNotes(i,v){for(let x=0;x<81;x++)if(peer(x,i))notes[x].delete(v)}function remaining(n){return Math.max(0,9-current.filter(v=>v===n).length)}function renderPad(){[...padEl.children].forEach((b,i)=>{const r=remaining(i+1);b.classList.toggle('done',r===0);b.querySelector('.remain').textContent=r||''})}function render(){boardEl.innerHTML='';for(let i=0;i<81;i++){const d=document.createElement('div');d.className='cell';if(puzzle[i])d.classList.add('given');else if(current[i])d.classList.add('user');if(selected>=0){if(i===selected)d.classList.add('selected');else if(peer(i,selected))d.classList.add('peer');if(current[selected]&&current[i]===current[selected])d.classList.add('same')}if(hasConflict(i))d.classList.add('conflict');if(wrong.has(i))d.classList.add('wrong');if(current[i])d.textContent=current[i];else if(notes[i].size){const ns=document.createElement('div');ns.className='notes';for(let n=1;n<=9;n++){const x=document.createElement('span');x.className='note';if(notes[i].has(n))x.textContent=n;ns.appendChild(x)}d.appendChild(ns)}d.onclick=()=>{if(paused)return;selected=i;wrong.delete(i);haptic();render()};boardEl.appendChild(d)}progressEl.textContent=`${current.filter(Boolean).length}/81 filled`;timerEl.textContent=formatTime(seconds);diffEl.textContent=difficulty[0].toUpperCase()+difficulty.slice(1);mistakesEl.textContent=mistakes;$('pencil').classList.toggle('active',pencil);renderPad()}function setNumber(n){if(selected<0||puzzle[selected]||solved||paused||remaining(n)===0)return;pushHistory();wrong.delete(selected);haptic();if(pencil){if(current[selected])current[selected]=0;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{current[selected]=n;notes[selected].clear();clearPeerNotes(selected,n);if(n!==solution[selected]){wrong.add(selected);mistakes++;flash('That number does not belong there')}}render();save();checkComplete()}function erase(){if(selected<0||puzzle[selected]||solved||paused)return;pushHistory();current[selected]=0;notes[selected].clear();wrong.delete(selected);haptic();render();save()}function undo(){const h=history.pop();if(!h||solved||paused)return;current=h.current;notes=h.notes.map(a=>new Set(a));wrong=new Set(h.wrong);mistakes=h.mistakes;haptic();render();save()}function hint(){if(selected<0||puzzle[selected]||solved||paused){flash('Select an empty square first');return}pushHistory();current[selected]=solution[selected];notes[selected].clear();wrong.delete(selected);clearPeerNotes(selected,current[selected]);haptic();render();save();checkComplete()}function check(){if(paused)return;wrong.clear();let empty=0;for(let i=0;i<81;i++){if(!current[i])empty++;else if(current[i]!==solution[i])wrong.add(i)}render();if(wrong.size)flash(`${wrong.size} incorrect ${wrong.size===1?'square':'squares'}`);else if(empty)flash(`Looking good — ${empty} empty`);else checkComplete()}function checkComplete(){if(!solved&&current.every((v,i)=>v===solution[i])){solved=true;stopTimer();recordWin();save();$('winTime').textContent=formatTime(seconds);$('winMistakes').textContent=mistakes;$('winBest').textContent=stats.best[difficulty]?formatTime(stats.best[difficulty]):'—';$('winText').textContent=`You solved this ${difficulty} puzzle.`;winModal.classList.add('show');haptic()}}function flash(t){messageEl.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>messageEl.textContent='',2200)}function newGame(d){difficulty=d;selected=-1;pencil=false;seconds=0;mistakes=0;solved=false;paused=false;wrong.clear();history=[];messageEl.textContent='Generating puzzle…';difficultyModal.classList.remove('show');pauseModal.classList.remove('show');setTimeout(()=>{const g=makePuzzle(d);puzzle=g.p;solution=g.sol;current=puzzle.slice();notes=blankNotes();messageEl.textContent='';stats.played++;saveStats();render();save();startTimer()},25)}function pauseGame(show=true){if(solved||paused)return;paused=true;stopTimer();save();if(show)pauseModal.classList.add('show')}function resumeGame(){if(solved)return;paused=false;pauseModal.classList.remove('show');startTimer();save()}function loadStats(){try{const s=JSON.parse(localStorage.getItem('peteSudokuStats')||'null');if(s)return{played:s.played||0,wins:s.wins||0,best:{easy:s.best?.easy||0,medium:s.best?.medium||0,hard:s.best?.hard||0,expert:s.best?.expert||0}}}catch(e){}return{played:0,wins:0,best:{easy:0,medium:0,hard:0,expert:0}}}function saveStats(){localStorage.setItem('peteSudokuStats',JSON.stringify(stats))}function recordWin(){stats.wins++;const b=stats.best[difficulty];if(!b||seconds<b)stats.best[difficulty]=seconds;saveStats()}function showStats(){$('playedStat').textContent=stats.played;$('winsStat').textContent=stats.wins;$('rateStat').textContent=stats.played?Math.round(stats.wins/stats.played*100)+'%':'0%';$('bestList').innerHTML=['easy','medium','hard','expert'].map(d=>`<div class="best-row"><span>${d[0].toUpperCase()+d.slice(1)} best</span><span>${stats.best[d]?formatTime(stats.best[d]):'—'}</span></div>`).join('');statsModal.classList.add('show')}function save(){try{localStorage.setItem('peteSudokuV2',JSON.stringify({puzzle,solution,current,notes:notes.map(s=>[...s]),seconds,difficulty,solved,mistakes}))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem('peteSudokuV2')||'null');if(!s){const old=JSON.parse(localStorage.getItem('peteSudoku')||'null');if(old)s={...old,mistakes:0}}if(s&&s.puzzle?.length===81&&s.solution?.length===81){puzzle=s.puzzle;solution=s.solution;current=s.current;notes=(s.notes||[]).map(a=>new Set(a));while(notes.length<81)notes.push(new Set);seconds=s.seconds||0;difficulty=s.difficulty||'easy';solved=!!s.solved;mistakes=s.mistakes||0;render();if(!solved)startTimer();return true}}catch(e){}return false}function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('peteSudokuTheme',t);$('themeBtn').textContent=t==='dark'?'☀':'☾'}for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='num';b.innerHTML=`${n}<span class="remain">9</span>`;b.onclick=()=>setNumber(n);padEl.appendChild(b)}$('pencil').onclick=()=>{if(!paused){pencil=!pencil;haptic();render()}};$('erase').onclick=erase;$('undo').onclick=undo;$('hint').onclick=hint;$('check').onclick=check;$('pause').onclick=()=>pauseGame(true);$('newGame').onclick=()=>{if(!paused)difficultyModal.classList.add('show')};$('cancelModal').onclick=()=>difficultyModal.classList.remove('show');$('playAgain').onclick=()=>{winModal.classList.remove('show');difficultyModal.classList.add('show')};$('closeWin').onclick=()=>winModal.classList.remove('show');$('resumeBtn').onclick=resumeGame;$('statsBtn').onclick=showStats;$('closeStats').onclick=()=>statsModal.classList.remove('show');$('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>newGame(b.dataset.diff));document.addEventListener('visibilitychange',()=>{if(document.hidden&&!solved)pauseGame(false);else if(!document.hidden&&paused)resumeGame()});const st=localStorage.getItem('peteSudokuTheme');applyTheme(st||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'));if(!load())newGame('easy')})();</script></body></html>
