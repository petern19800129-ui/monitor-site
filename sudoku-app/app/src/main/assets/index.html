<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sudoku</title>
<style>
:root{--bg:#101318;--panel:#171c24;--panel2:#1e2530;--text:#f4f7fb;--muted:#9ba8b8;--accent:#7aa2ff;--accent2:#4f7fe9;--line:#4c596b;--thin:#293443;--wrong:#ff6b78;--good:#65d69b;--selected:#263c66;--peer:#1d2a3b;--same:#243556}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:center}
.app{width:min(100%,560px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px}.title{font-size:30px;font-weight:800;letter-spacing:.2px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.status{text-align:right}.timer{font-variant-numeric:tabular-nums;font-weight:750;font-size:21px}.diff{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.9px}
.board-wrap{background:var(--panel);padding:7px;border-radius:18px;box-shadow:0 12px 32px #0005}#board{aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,1fr);background:var(--line);gap:1px;border:2px solid var(--line);border-radius:11px;overflow:hidden;touch-action:manipulation}.cell{position:relative;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:clamp(21px,7vw,34px);font-weight:600;cursor:pointer;user-select:none}.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--line)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line)}.cell.given{color:#fff;font-weight:800}.cell.user{color:var(--accent)}.cell.peer{background:var(--peer)}.cell.same{background:var(--same)}.cell.selected{background:var(--selected);outline:2px solid var(--accent);outline-offset:-2px}.cell.conflict,.cell.wrong{color:var(--wrong)}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,2.3vw,11px);font-weight:650;color:#aab9cc}.note{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:15px 0 10px}.num{height:48px;border:0;border-radius:11px;background:var(--panel2);color:var(--accent);font-size:22px;font-weight:800;box-shadow:inset 0 0 0 1px #ffffff0c}.num:active{transform:scale(.96);background:#26344a}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tool{min-height:54px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font-size:12px;font-weight:750;padding:7px 3px}.tool .ico{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.tool.active{background:var(--accent2);color:#fff}.tool:active{transform:scale(.97)}.new{width:100%;margin-top:9px;height:49px;border:0;border-radius:13px;background:var(--accent);color:#0d1628;font-size:16px;font-weight:850}.message{height:24px;text-align:center;color:var(--muted);font-size:13px;padding-top:7px}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:25px;z-index:20}.overlay.show{display:flex}.card{width:min(100%,420px);background:#1b222d;border:1px solid #ffffff18;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0008}.card h2{margin:0 0 6px;font-size:25px}.card p{color:var(--muted);margin:0 0 18px;line-height:1.45}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:0;background:#252f3d;color:#fff;padding:15px 10px;border-radius:13px;font-weight:800;font-size:15px}.choice small{display:block;color:#9fb2cc;font-weight:600;margin-top:4px}.cancel{width:100%;margin-top:10px;border:0;background:transparent;color:#aab7c8;padding:10px;font-weight:700}@media(max-width:360px){body{padding-left:8px;padding-right:8px}.board-wrap{padding:5px}.pad{gap:4px}.num{height:44px}.tools{gap:4px}.tool{font-size:11px}}
</style>
</head>
<body>
<div class="app"><div class="top"><div><div class="title">Sudoku</div><div class="sub" id="progress">Offline puzzle</div></div><div class="status"><div class="timer" id="timer">00:00</div><div class="diff" id="difficulty">Easy</div></div></div><div class="board-wrap"><div id="board" aria-label="Sudoku board"></div></div><div class="pad" id="pad"></div><div class="tools"><button class="tool" id="pencil"><span class="ico">✎</span>Pencil</button><button class="tool" id="erase"><span class="ico">⌫</span>Erase</button><button class="tool" id="undo"><span class="ico">↶</span>Undo</button><button class="tool" id="hint"><span class="ico">💡</span>Hint</button><button class="tool" id="check"><span class="ico">✓</span>Check</button></div><button class="new" id="newGame">New game</button><div class="message" id="message"></div></div>
<div class="overlay" id="difficultyModal"><div class="card"><h2>New game</h2><p>Choose a difficulty. Every puzzle is generated on your phone and works fully offline.</p><div class="choices"><button class="choice" data-diff="easy">Easy<small>More clues</small></button><button class="choice" data-diff="medium">Medium<small>Balanced</small></button><button class="choice" data-diff="hard">Hard<small>Fewer clues</small></button><button class="choice" data-diff="expert">Expert<small>Very few clues</small></button></div><button class="cancel" id="cancelModal">Cancel</button></div></div>
<div class="overlay" id="winModal"><div class="card"><h2>🎉 Puzzle solved</h2><p id="winText"></p><button class="new" id="playAgain">Play another</button><button class="cancel" id="closeWin">Close</button></div></div>
<script>
(() => {
'use strict';
const boardEl=document.getElementById('board'),padEl=document.getElementById('pad'),timerEl=document.getElementById('timer'),diffEl=document.getElementById('difficulty'),progressEl=document.getElementById('progress'),messageEl=document.getElementById('message');
const difficultyModal=document.getElementById('difficultyModal'),winModal=document.getElementById('winModal');
const targets={easy:36,medium:45,hard:51,expert:56};let puzzle=[],solution=[],current=[],notes=[],selected=-1,pencil=false,seconds=0,timerHandle=null,history=[],difficulty='easy',wrong=new Set(),solved=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pattern(r,c){return (r*3+Math.floor(r/3)+c)%9}function makeSolution(){const base=[0,1,2],rows=shuffle(base.slice()).flatMap(g=>shuffle(base.slice()).map(r=>g*3+r)),cols=shuffle(base.slice()).flatMap(g=>shuffle(base.slice()).map(c=>g*3+c)),nums=shuffle([1,2,3,4,5,6,7,8,9]);return rows.flatMap(r=>cols.map(c=>nums[pattern(r,c)]))}
function candidates(b,idx){if(b[idx])return [];const r=Math.floor(idx/9),c=idx%9,used=new Set();for(let i=0;i<9;i++){used.add(b[r*9+i]);used.add(b[i*9+c])}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)used.add(b[rr*9+cc]);return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}function countSolutions(b,limit=2){let best=-1,bestC=null;for(let i=0;i<81;i++)if(!b[i]){const c=candidates(b,i);if(c.length===0)return 0;if(best<0||c.length<bestC.length){best=i;bestC=c;if(c.length===1)break}}if(best<0)return 1;let count=0;for(const n of bestC){b[best]=n;count+=countSolutions(b,limit-count);b[best]=0;if(count>=limit)return count}return count}function makePuzzle(diff){const sol=makeSolution(),p=sol.slice(),order=shuffle([...Array(81).keys()]),target=targets[diff];let removed=0;for(const idx of order){if(removed>=target)break;const old=p[idx];p[idx]=0;if(countSolutions(p.slice(),2)===1)removed++;else p[idx]=old}return {p,sol}}
function blankNotes(){return Array.from({length:81},()=>new Set())}function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(){clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!solved){seconds++;timerEl.textContent=formatTime(seconds);if(seconds%5===0)save()}},1000)}function pushHistory(){history.push({current:current.slice(),notes:notes.map(s=>[...s]),wrong:[...wrong]});if(history.length>80)history.shift()}function peer(a,b){const ar=Math.floor(a/9),ac=a%9,br=Math.floor(b/9),bc=b%9;return ar===br||ac===bc||(Math.floor(ar/3)===Math.floor(br/3)&&Math.floor(ac/3)===Math.floor(bc/3))}function hasConflict(idx){const v=current[idx];if(!v)return false;for(let i=0;i<81;i++)if(i!==idx&&current[i]===v&&peer(i,idx))return true;return false}function clearPeerNotes(idx,v){for(let i=0;i<81;i++)if(peer(i,idx))notes[i].delete(v)}
function render(){boardEl.innerHTML='';for(let i=0;i<81;i++){const d=document.createElement('div');d.className='cell';if(puzzle[i])d.classList.add('given');else if(current[i])d.classList.add('user');if(selected>=0){if(i===selected)d.classList.add('selected');else if(peer(i,selected))d.classList.add('peer');if(current[selected]&&current[i]===current[selected])d.classList.add('same')}if(hasConflict(i))d.classList.add('conflict');if(wrong.has(i))d.classList.add('wrong');if(current[i])d.textContent=current[i];else if(notes[i].size){const ns=document.createElement('div');ns.className='notes';for(let n=1;n<=9;n++){const x=document.createElement('span');x.className='note';if(notes[i].has(n))x.textContent=n;ns.appendChild(x)}d.appendChild(ns)}d.addEventListener('click',()=>{selected=i;wrong.delete(i);render()});boardEl.appendChild(d)}const filled=current.filter(Boolean).length;progressEl.textContent=`${filled}/81 filled`;timerEl.textContent=formatTime(seconds);diffEl.textContent=difficulty[0].toUpperCase()+difficulty.slice(1);document.getElementById('pencil').classList.toggle('active',pencil)}
function setNumber(n){if(selected<0||puzzle[selected]||solved)return;pushHistory();wrong.delete(selected);if(pencil){if(current[selected])current[selected]=0;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{current[selected]=n;notes[selected].clear();clearPeerNotes(selected,n)}render();save();checkComplete()}function erase(){if(selected<0||puzzle[selected]||solved)return;pushHistory();current[selected]=0;notes[selected].clear();wrong.delete(selected);render();save()}function undo(){const h=history.pop();if(!h||solved)return;current=h.current;notes=h.notes.map(a=>new Set(a));wrong=new Set(h.wrong);render();save()}function hint(){if(selected<0||puzzle[selected]||solved){flash('Select an empty square first');return}pushHistory();current[selected]=solution[selected];notes[selected].clear();wrong.delete(selected);clearPeerNotes(selected,current[selected]);render();save();checkComplete()}function check(){wrong.clear();let empty=0;for(let i=0;i<81;i++){if(!current[i])empty++;else if(current[i]!==solution[i])wrong.add(i)}render();if(wrong.size)flash(`${wrong.size} incorrect ${wrong.size===1?'square':'squares'}`);else if(empty)flash(`Looking good — ${empty} empty`);else checkComplete()}function checkComplete(){if(current.every((v,i)=>v===solution[i])){solved=true;clearInterval(timerHandle);save();document.getElementById('winText').textContent=`You solved this ${difficulty} puzzle in ${formatTime(seconds)}.`;winModal.classList.add('show')}}function flash(t){messageEl.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>messageEl.textContent='',2200)}
function newGame(diff){difficulty=diff;selected=-1;pencil=false;seconds=0;solved=false;wrong.clear();history=[];messageEl.textContent='Generating puzzle…';setTimeout(()=>{const g=makePuzzle(diff);puzzle=g.p;solution=g.sol;current=puzzle.slice();notes=blankNotes();difficultyModal.classList.remove('show');messageEl.textContent='';render();save();startTimer()},20)}function save(){try{localStorage.setItem('peteSudoku',JSON.stringify({puzzle,solution,current,notes:notes.map(s=>[...s]),seconds,difficulty,solved}))}catch(e){}}function load(){try{const s=JSON.parse(localStorage.getItem('peteSudoku')||'null');if(s&&s.puzzle?.length===81&&s.solution?.length===81){puzzle=s.puzzle;solution=s.solution;current=s.current;notes=(s.notes||[]).map(a=>new Set(a));while(notes.length<81)notes.push(new Set());seconds=s.seconds||0;difficulty=s.difficulty||'easy';solved=!!s.solved;render();if(!solved)startTimer();return true}}catch(e){}return false}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='num';b.textContent=n;b.addEventListener('click',()=>setNumber(n));padEl.appendChild(b)}document.getElementById('pencil').onclick=()=>{pencil=!pencil;render()};document.getElementById('erase').onclick=erase;document.getElementById('undo').onclick=undo;document.getElementById('hint').onclick=hint;document.getElementById('check').onclick=check;document.getElementById('newGame').onclick=()=>difficultyModal.classList.add('show');document.getElementById('cancelModal').onclick=()=>difficultyModal.classList.remove('show');document.getElementById('playAgain').onclick=()=>{winModal.classList.remove('show');difficultyModal.classList.add('show')};document.getElementById('closeWin').onclick=()=>winModal.classList.remove('show');document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>newGame(b.dataset.diff));if(!load())newGame('easy');
})();
</script>
</body>
</html>
