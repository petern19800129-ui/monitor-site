name: Build Sudoku APK
on:
  pull_request:
    paths:
      - 'sudoku-app/**'
      - '.github/workflows/build-sudoku-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pete-sudoku-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: sudoku-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pete-Sudoku-APK
          path: sudoku-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
