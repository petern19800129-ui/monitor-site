name: Build Sudoku APK
on:
  pull_request:
    paths:
      - 'sudoku-app/**'
      - '.github/workflows/build-sudoku-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Sudoku signing key
        uses: actions/cache@v4
        with:
          path: sudoku-app/.signing/pete-sudoku.keystore
          key: pete-sudoku-signing-keystore-v2
      - name: Create signing key if missing
        run: |
          mkdir -p sudoku-app/.signing
          if [ ! -f sudoku-app/.signing/pete-sudoku.keystore ]; then
            keytool -genkeypair \
              -keystore sudoku-app/.signing/pete-sudoku.keystore \
              -storepass pete-sudoku-2026 \
              -keypass pete-sudoku-2026 \
              -alias pete-sudoku \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Pete Sudoku,O=Pete Sudoku,C=ZA"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: sudoku-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pete-Sudoku-APK
          path: sudoku-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
